version: 0.2

phases:
  install:
    runtime-versions:
      golang: 1.22
    commands:
      - echo "Installing dependencies..."
      - cd order-management
      - go mod download

  pre_build:
    commands:
      - echo "Running tests..."
      - go test ./... -v

  build:
    commands:
      - echo "Building binary..."
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/server main.go

artifacts:
  files:
    - order-management/bin/server
    - order-management/Procfile
    - order-management/.env
  discard-paths: no